plugins {
    alias(libs.plugins.android.application)
}

// Read database credentials from local.properties
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def dbHost = localProps.getProperty('db.host')
def dbPort = localProps.getProperty('db.port')
def dbName = localProps.getProperty('db.name')
def dbUser = localProps.getProperty('db.user')
def dbPassword = localProps.getProperty('db.password')

if (!dbHost || !dbPort || !dbName || !dbUser || !dbPassword) {
    throw new GradleException(
        "Missing required database properties in local.properties. " +
        "Please add: db.host, db.port, db.name, db.user, db.password"
    )
}

android {
    namespace 'com.jve.repsup'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.jve.repsup"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Database connection config injected from local.properties
        buildConfigField "String", "DB_HOST", "\"${dbHost}\""
        buildConfigField "String", "DB_PORT", "\"${dbPort}\""
        buildConfigField "String", "DB_NAME", "\"${dbName}\""
        buildConfigField "String", "DB_USER", "\"${dbUser}\""
        buildConfigField "String", "DB_PASSWORD", "\"${dbPassword}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // MySQL JDBC connector for direct database access
    implementation 'com.mysql:mysql-connector-j:8.2.0'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}